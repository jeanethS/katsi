[project]
name = "mnemo-mcp"
version = "0.1.0"
description = "mnemo MCP server (FastMCP)."
requires-python = ">=3.12,<3.14"
authors = [{ name = "mnemo contributors" }]
license = { text = "MIT" }
# readme lives at workspace root, not in this package
keywords = ["mcp", "rag", "knowledge-graph", "ollama", "local", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mnemo-core",
    "mcp>=1.0",
]

[project.scripts]
mnemo-mcp = "mnemo_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jeaneths/mnemo"
Repository = "https://github.com/jeaneths/mnemo"
Issues = "https://github.com/jeaneths/mnemo/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemo_mcp"]
