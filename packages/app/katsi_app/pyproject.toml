[project]
name = "katsi-app"
version = "0.1.0"
description = "HTTP backend for the katsi desktop app."
requires-python = ">=3.12,<3.14"
dependencies = [
    "katsi-core",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.scripts]
katsi-app = "katsi_app.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["katsi_app"]
