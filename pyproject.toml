[project]
name = "mnemo"
version = "0.1.0"
description = "Local-first MCP server for relational file context."
requires-python = ">=3.12,<3.14"
authors = [{ name = "mnemo contributors" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["mcp", "rag", "knowledge-graph", "ollama", "local", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/jeaneths/mnemo"
Repository = "https://github.com/jeaneths/mnemo"
Issues = "https://github.com/jeaneths/mnemo/issues"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mnemo-core = { workspace = true }
mnemo-mcp = { workspace = true }
mnemo-cli = { workspace = true }

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]   # let line-length be advisory; formatter enforces soft wrap

[tool.ruff.lint.isort]
known-first-party = ["mnemo_core", "mnemo_mcp", "mnemo_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
dev-mode-dirs = ["."]
