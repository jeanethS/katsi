[project]
name = "katsi"
version = "0.1.0"
description = "Local-first MCP server for relational file context."
requires-python = ">=3.12,<3.14"
authors = [{ name = "katsi contributors" }]
license = { text = "MIT" }
readme = "README.md"
keywords = ["mcp", "rag", "knowledge-graph", "ollama", "local", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "katsi-cli",
]

[project.scripts]
katsi = "katsi_cli.main:main"

[project.urls]
Homepage = "https://github.com/jeanethS/katsi"
Repository = "https://github.com/jeanethS/katsi"
Issues = "https://github.com/jeanethS/katsi/issues"

[project.optional-dependencies]
pdf = [
    "markitdown[pdf]>=0.1.6",
]

# Explicit members, not packages/* — packages/app is a container (JS frontend +
# katsi_app backend), not itself a Python package.
[tool.uv.workspace]
members = ["packages/core", "packages/cli", "packages/mcp_server", "packages/app/katsi_app"]

[tool.uv.sources]
katsi-core = { workspace = true }
katsi-mcp = { workspace = true }
katsi-cli = { workspace = true }
katsi-app = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", ".claude/worktrees/multimedia-understanding"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E501"]   # let line-length be advisory; formatter enforces soft wrap

[tool.ruff.lint.isort]
known-first-party = ["katsi_core", "katsi_mcp", "katsi_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
dev-mode-dirs = ["."]
